AWSTemplateFormatVersion: '2010-09-09'
Description: >
  UtopiaFormatter — static site (S3 + CloudFront) with GitHub Actions OIDC deploys,
  plus the unrecognized-line logging pipeline (HTTP API → Lambda → S3).

  This template describes the infrastructure as it actually runs: one site bucket
  (prod at the root, dev under the dev/ prefix) behind one CloudFront distribution.
  The live resources were created by hand, not from this template; keep this file in
  sync with any manual change so the setup can be rebuilt or imported into
  CloudFormation later. No account-specific values are hardcoded — they are all
  parameters (see params.example.json, which also has the deploy commands).

  Not managed here (create first, pass in as parameters):
    - The GitHub OIDC identity provider (one per account, shared by several projects)
    - The ACM certificate (us-east-1) and its DNS validation records
    - The Route 53 hosted zone
    - The WAF web ACL (created by CloudFront's one-click protection)

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub username or organisation that owns the repository.

  GitHubRepo:
    Type: String
    Default: UtopiaFormatter
    Description: Repository name (case-sensitive).

  DomainName:
    Type: String
    Description: Apex domain of the site (www.<DomainName> is served too).

  AcmCertificateArn:
    Type: String
    Description: ACM certificate (us-east-1) covering DomainName and www.DomainName.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone for DomainName.

  WebAclArn:
    Type: String
    Default: ''
    Description: WAF web ACL ARN to attach to the distribution. Leave empty for none.

  SiteBucketName:
    Type: String
    Description: Name of the site bucket.

  LogBucketName:
    Type: String
    Description: Name of the bucket the log handler writes to.

  AdminPrincipalArns:
    Type: CommaDelimitedList
    Description: >
      IAM principals (e.g. the account root and your admin user) given full access
      to the site bucket and exempted from the log bucket's deny-everything rule.

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, '']]

Resources:

  # ── Site bucket ──────────────────────────────────────────────────────────────
  # Prod content lives at the bucket root, dev content under dev/.
  # Versioning lets any overwritten or deleted file be recovered (120 days).

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: Expire old versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 120

  # CloudFront reads via OAC; admins get full access. The GitHub Actions roles are
  # deliberately NOT granted anything here: within one account a bucket-policy
  # Allow works on its own and would bypass the roles' least-privilege policies.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: AllowIAMUsers
            Effect: Allow
            Principal:
              AWS: !Ref AdminPrincipalArns
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'

  # ── CloudFront ───────────────────────────────────────────────────────────────

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: utopia-formatter-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves index.html for folder paths (e.g. /dev/ → /dev/index.html), which is
  # why the distribution has no DefaultRootObject.
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: utopia-formatter-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Handles automatically serving index.html when navigating to website folders
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        async function handler(event) {
          const request = event.request;
          const uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.', uri.lastIndexOf('/'))) {
            request.uri += '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Utopia Formatter
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.3_2025
        Origins:
          - Id: utopia-formatter
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: utopia-formatter
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed: CachingOptimized
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN

  # ── DNS ──────────────────────────────────────────────────────────────────────

  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's hosted zone ID (constant)
        EvaluateTargetHealth: false

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ── GitHub Actions deploy roles (OIDC, no long-lived keys) ───────────────────
  # main runs in the "production" GitHub environment, which only the main branch
  # may use (repo settings); every other branch runs in "development". Each role
  # trusts exactly one environment, so a branch can't reach prod even by editing
  # the workflow file.

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UtopiaFormatterGitHubActions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:production'
      Policies:
        - PolicyName: DeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Deploy
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt SiteBucket.Arn
                  - !Sub '${SiteBucket.Arn}/*'
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  GitHubActionsRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UtopiaFormatterGitHubActionsDev
      Description: UtopiaFormatter GitHub Actions - development environment, dev/ prefix only
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:development'
      Policies:
        - PolicyName: DeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3DevObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/dev/*'
              - Sid: S3DevList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ['dev/', 'dev/*']
              # IAM can't limit which paths an invalidation covers; the worst a dev
              # run can do here is force a cache refresh, never change content.
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ── Unrecognized-line logging: HTTP API → Lambda → S3 ────────────────────────
  # Write-only from the browser: the API is throttled and CORS-restricted to the
  # site; the Lambda caps payload size, always returns 200, has reserved
  # concurrency of 10, and can only PutObject under logs/.

  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref LogBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      LifecycleConfiguration:
        Rules:
          - Id: expire-log-archive
            Status: Enabled
            Prefix: logs/archive/
            ExpirationInDays: 7

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaPutOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt LogLambdaRole.Arn
            Action: s3:PutObject
            Resource: !Sub '${LogBucket.Arn}/logs/*'
          - Sid: DenyEverythingElse
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub '${LogBucket.Arn}/*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !Split
                  - ','
                  - !Join [',', [!GetAtt LogLambdaRole.Arn, !Join [',', !Ref AdminPrincipalArns]]]

  LogLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: utopia-formatter-log-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LogLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogsOnly
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${LogBucket.Arn}/logs/*'
              - Sid: BasicLambdaExecution
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:log-group:/aws/lambda/utopia-log-handler:*

  LogHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: utopia-log-handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      Handler: log-handler.handler
      Code: ../lambda  # uploaded by `aws cloudformation package`
      MemorySize: 128
      Timeout: 5
      ReservedConcurrentExecutions: 10
      Role: !GetAtt LogLambdaRole.Arn
      Environment:
        Variables:
          LOG_BUCKET: !Ref LogBucket

  LogApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: utopia-formatter-log-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${DomainName}'
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 300

  LogApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LogApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LogHandlerFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  LogApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LogApi
      RouteKey: POST /log
      Target: !Sub 'integrations/${LogApiIntegration}'

  LogApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref LogApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 50

  LogApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LogApi}/*/*/log'

Outputs:
  # Add these as GitHub Secrets. Prod and dev share the bucket and distribution;
  # the workflow targets dev via the dev/ prefix.

  SiteBucketName:
    Description: "→ GitHub Secrets: S3_BUCKET_PROD and S3_BUCKET_DEV"
    Value: !Ref SiteBucket

  DistributionId:
    Description: "→ GitHub Secrets: CLOUDFRONT_ID_PROD and CLOUDFRONT_ID_DEV"
    Value: !Ref Distribution

  GitHubActionsRoleArn:
    Description: "→ GitHub Secret: AWS_ROLE_ARN (prod role)"
    Value: !GetAtt GitHubActionsRole.Arn

  GitHubActionsRoleDevArn:
    Description: "→ GitHub Secret: AWS_ROLE_ARN_DEV"
    Value: !GetAtt GitHubActionsRoleDev.Arn

  LogEndpoint:
    Description: "→ GitHub Secret: LOG_ENDPOINT"
    Value: !Sub 'https://${LogApi}.execute-api.${AWS::Region}.amazonaws.com/log'
